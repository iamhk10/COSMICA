<title>Cosmica — Sky map</title>
<meta name="description" content="Cosmica: tonight's sky for your place — Moon phase, sunrise and sunset, visible planets and a live star map. Works offline. Quiz, sky events, history, facts. English and Hinglish.">

<meta name="color-scheme" content="dark">

<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<header class="top">
  <a class="brand" href="#/" aria-label="Cosmica">
    <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><use href="#logo"/></svg>
    <span>Cosmica</span>
  </a>
  <div class="top-r">
    <span id="offChip" class="pill off" hidden data-i18n="offline">Offline</span>
    <button id="btnInstall" class="pill acc" hidden data-i18n="install">Install</button>
    <button id="btnLoc" class="pill loc" data-i18n-aria="chooseLoc" aria-label="Choose location">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.4" fill="currentColor"/></svg>
      <span id="locName">…</span>
    </button>
    <button id="btnLang" class="pill" aria-label="Language"><b id="langEn">EN</b><i>|</i><b id="langHi">HI</b></button>
    <button id="btnNight" class="pill ico" data-i18n-aria="nightMode" aria-label="Night mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<nav class="dock" aria-label="Main">
  <a href="#/" data-route="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i18n="nav.today">Today</span></a>
  <a href="#/sky" data-route="sky"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m12 6 1.6 4.4L18 12l-4.4 1.6L12 18l-1.6-4.4L6 12l4.4-1.6Z" fill="currentColor"/></svg><span data-i18n="nav.sky">Sky</span></a>
  <a href="#/events" data-route="events"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m12 12.2.9 1.9 2.1.3-1.5 1.5.4 2.1-1.9-1-1.9 1 .4-2.1-1.5-1.5 2.1-.3Z" fill="currentColor"/></svg><span data-i18n="nav.events">Events</span></a>
  <a href="#/learn" data-route="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 7.5h8M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i18n="nav.learn">Learn</span></a>
  <a href="#/quiz" data-route="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.9 2.2c-.9.6-1.4 1-1.4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.2" fill="currentColor"/></svg><span data-i18n="nav.quiz">Quiz</span></a>
  <a href="#/about" data-route="about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.4" fill="currentColor"/></svg><span data-i18n="nav.about">About</span></a>
</nav>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-h"><h2 id="dlgTitle"></h2><button id="dlgX" class="x" aria-label="Close">×</button></div>
  <div id="dlgBody"></div>
</dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 48 48">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c9cff"/><stop offset="1" stop-color="#c58bff"/></linearGradient></defs>
      <circle cx="24" cy="24" r="21" fill="#0c1230" stroke="url(#lg)" stroke-width="2.4"/>
      <ellipse cx="24" cy="24" rx="21" ry="7.5" fill="none" stroke="url(#lg)" stroke-width="1.6" transform="rotate(-24 24 24)" opacity=".9"/>
      <path d="m24 11 2.6 8.4L35 22l-8.4 2.6L24 33l-2.6-8.4L13 22l8.4-2.6Z" fill="#fff"/>
    </symbol>
  </defs>
</svg>
